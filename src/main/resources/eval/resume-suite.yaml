- caseId: resume_001
  input: 请帮我优化一份Java开发工程师的简历，突出项目经验和技术栈
  expectedOutput: 简历优化建议，包含STAR法则应用、关键词优化、量化指标建议
  category: resume
  scoringRule: LLM_JUDGE
  passThreshold: 0.6
- caseId: resume_002
  input: 我的简历里有一段工作经历写的是"负责公司后台管理系统开发"，帮我优化
  expectedOutput: 使用STAR法则重写的经历描述，包含具体技术、规模、成果
  category: resume
  scoringRule: SEMANTIC_SIMILARITY
  passThreshold: 0.5
- caseId: resume_003
  input: 帮我针对阿里巴巴Java后端岗位调整简历重点
