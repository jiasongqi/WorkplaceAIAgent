spring:
  application:
    name: yu-ai-agent
  profiles:
    active: local
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/yuaiagent}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: false
  ai:
    dashscope:
      # API Key 通过环境变量 DASHSCOPE_API_KEY 注入，禁止硬编码到代码仓库
      api-key: ${DASHSCOPE_API_KEY:}
      chat:
        options:
          model: qwen3.7-max
      # 同步 call() 的 HTTP 超时（须小于 SSE 300s，避免 silent hang）
      http:
        connect-timeout: ${DASHSCOPE_CONNECT_TIMEOUT:10s}
        read-timeout: ${DASHSCOPE_READ_TIMEOUT:90s}
    ollama:
      base-url: http://localhost:11434
      chat:
        model: gemma3:1b
    mcp:
      client:
        sse:
          connections:
            server1:
              url: http://localhost:8127
        stdio:
          servers-configuration: classpath:mcp-servers.json
    vectorstore:
      pgvector:
        index-type: HNSW
        dimensions: 1536
        distance-type: COSINE_DISTANCE
        max-document-batch-size: 10000
server:
  port: 8123
  servlet:
    context-path: /api
# springdoc-openapi config
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.yupi.yuaiagent.controller
# knife4j config
knife4j:
  enable: true
  setting:
    language: zh_cn
# searchAPI
search-api:
  # API Key 通过环境变量 SEARCH_API_KEY 注入
  api-key: ${SEARCH_API_KEY:}
# JWT 密钥（本地请用 application-local.yml 或环境变量；生产必须注入 JWT_SECRET）
jwt:
  secret: ${JWT_SECRET:}
  access-expire-ms: ${JWT_ACCESS_EXPIRE_MS:1800000}
  refresh-expire-ms: ${JWT_REFRESH_EXPIRE_MS:1209600000}
# 日历服务配置
calendar:
  # 默认日历服务提供商：FEISHU 或 DINGTALK
  provider: ${CALENDAR_PROVIDER:FEISHU}
  feishu:
    # 飞书开放平台应用凭证
    app-id: ${FEISHU_APP_ID:}
    app-secret: ${FEISHU_APP_SECRET:}
    base-url: ${FEISHU_BASE_URL:https://open.feishu.cn/open-apis}
  dingtalk:
    # 钉钉开放平台应用凭证
    app-key: ${DINGTALK_APP_KEY:}
    app-secret: ${DINGTALK_APP_SECRET:}
    base-url: ${DINGTALK_BASE_URL:https://api.dingtalk.com}
# 预约记录存储配置
appointment:
  storage:
    dir: ${APPOINTMENT_STORAGE_DIR:./tmp/appointments}
# 会话记录 + 跨 Agent 共享状态
session:
  storage:
    dir: ${SESSION_STORAGE_DIR:./tmp/sessions}
  shared-state:
    storage:
      dir: ${SESSION_SHARED_STATE_DIR:./tmp/session-shared-state}
# 交付物货架存储配置
artifact:
  storage:
    dir: ${ARTIFACT_STORAGE_DIR:./tmp/artifacts}
# 用户画像存储配置
user-profile:
  storage:
    dir: ${USER_PROFILE_STORAGE_DIR:./tmp/user-profiles}
# 画像注入配置（单次请求注入画像提示词的字符上限）
profile:
  injection:
    max-chars: ${PROFILE_INJECTION_MAX_CHARS:1000}
# 追问模板配置（可选，不配置则使用默认模板）
consultation:
  follow-up:
    # 可以在这里覆盖默认模板
    # core:
    #   name:
    #     question: "请输入您的姓名"
# 执行轨迹配置
trace:
  storage:
    dir: ${TRACE_STORAGE_DIR:./tmp/traces}          # Req 3.9：默认 ./tmp/traces
  stream:
    enabled: ${TRACE_STREAM_ENABLED:true}           # Req 9.5：实时 trace 事件流，默认启用
  max-spans-per-trace: ${TRACE_MAX_SPANS:200}       # Req 11.1：[1,1000]，默认 200
  metadata:
    max-value-chars: ${TRACE_META_MAX_CHARS:2000}   # Req 11.3：[1,4096]，默认 2000
  max-traces-per-user: ${TRACE_MAX_PER_USER:500}    # Req 11.5：[1,100000]，默认 500
# 对话记忆压缩配置
chat:
  memory:
    compression:
      # Token 阈值，超过此值触发压缩
      token-threshold: ${CHAT_TOKEN_THRESHOLD:4000}
      # 对话轮数阈值，超过此值触发压缩
      turn-threshold: ${CHAT_TURN_THRESHOLD:20}
      # 保留最近 N 轮对话的完整内容
      recent-turns: ${CHAT_RECENT_TURNS:5}
# ─── 治理层配置（Governance） ───
# 沙箱配置
sandbox:
  base-dir: ${SANDBOX_BASE_DIR:./tmp/sandbox}
  default-timeout: ${SANDBOX_TIMEOUT:30}
  max-output-size: ${SANDBOX_MAX_OUTPUT:10485760}    # 10MB
  require-docker: ${SANDBOX_REQUIRE_DOCKER:false}     # 生产环境建议设为 true
  docker:
    image: ${SANDBOX_DOCKER_IMAGE:python:3.12-slim}
    default-timeout: ${SANDBOX_DOCKER_TIMEOUT:30}
# MCP 信任配置
mcp:
  trust:
    # 默认信任等级：VERIFIED / PARTNER / COMMUNITY / PRIVATE
    default-level: ${MCP_DEFAULT_TRUST:PRIVATE}
    # 是否启用信任校验
    enabled: ${MCP_TRUST_ENABLED:true}
  client:
    # MCP tool execution timeout (seconds)
    timeout:
      connect: 10
      read: 30

# Agent Runtime governance
agent:
  runtime:
    # Tool execution timeout in seconds (applied via CompletableFuture.orTimeout)
    tool-timeout-seconds: 30
    # ChatMemory hard limits
    memory:
      max-messages: 100
      max-prompt-tokens: 8000
  # ─── Guard 防护组件配置 ───
    guard:
      loop-run:
        # Single Agent run token fuse (Manus / ToolCallAgent loop); 0 = only daily snapshot
        max-tokens: ${GUARD_LOOP_RUN_MAX_TOKENS:25000}
      token-budget:
        # 模型上下文窗口总 Token 预算（与 memory.max-prompt-tokens 一致）
        max-tokens: ${GUARD_BUDGET_MAX_TOKENS:8000}
        # Observation 正常模式保留字符数
        observation-max-normal: 3000
        # Observation Compact 模式截断字符数
        observation-max-compact: 1500
      loop-detector:
        # 滑动窗口大小（保留最近 N 条工具调用 embedding）
        window-size: ${GUARD_LOOP_WINDOW_SIZE:5}
        # 余弦相似度阈值，超过此值判定为重复调用（0.88 更敏感）
        similarity-threshold: ${GUARD_LOOP_SIMILARITY_THRESHOLD:0.88}
        # 连续重复次数阈值，达到后注入引导消息
        consecutive-threshold: ${GUARD_LOOP_CONSECUTIVE_THRESHOLD:2}

# ─── 应用层配置 ───
app:
  storage:
    # file = 消息/轨迹落 ./tmp（演示）; jdbc = PostgreSQL MessageStore/TraceStore
    type: ${STORAGE_TYPE:file}
  auth:
    # 默认关闭游客：强制注册/登录，防止 API Token 被刷
    # 临时演示可设 GUEST_ENABLED=true（且建议同时 GUEST_PASSWORD_REQUIRED=true）
    guest-enabled: ${GUEST_ENABLED:false}
    guest-password-required: ${GUEST_PASSWORD_REQUIRED:true}
    guest-password: ${GUEST_PASSWORD:}
    admin-password: ${ADMIN_PASSWORD:}
    storage-dir: ${AUTH_STORAGE_DIR:./tmp/auth}
    quota:
      guest:
        daily-chats: ${QUOTA_GUEST_CHATS:3}
        daily-tokens: ${QUOTA_GUEST_TOKENS:15000}
      user:
        daily-chats: ${QUOTA_USER_CHATS:50}
        daily-tokens: ${QUOTA_USER_TOKENS:200000}
      admin:
        daily-chats: ${QUOTA_ADMIN_CHATS:10000}
        daily-tokens: ${QUOTA_ADMIN_TOKENS:50000000}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000,http://localhost:3001,http://127.0.0.1:3000,http://127.0.0.1:3001,http://localhost:8123,https://www.codefather.cn}
  # 人工审批网关（HITL）— 高危副作用操作执行前需人工确认
  hitl:
    terminal-require-approval: ${HITL_TERMINAL_APPROVAL:true}
    calendar-require-approval: ${HITL_CALENDAR_APPROVAL:true}
    file-write-require-approval: ${HITL_FILE_WRITE_APPROVAL:true}
    approval-ttl-seconds: ${HITL_APPROVAL_TTL_SECONDS:300}
    human-handoff-ttl-seconds: ${HITL_HUMAN_HANDOFF_TTL_SECONDS:86400}
    max-consecutive-tool-errors: ${HITL_MAX_CONSECUTIVE_TOOL_ERRORS:3}
    storage-dir: ${HITL_STORAGE_DIR:./tmp/hitl}
    notify-webhook: ${HITL_NOTIFY_WEBHOOK:}

  # Tool Call 工程增强（mm_agent_tutorial Ch3）
  tools:
    idempotency-ttl-seconds: ${TOOL_IDEMPOTENCY_TTL_SECONDS:600}
    async-task-ttl-seconds: ${TOOL_ASYNC_TASK_TTL_SECONDS:3600}

  # 感知层（文档/图片预处理）
  perception:
    image-max-edge-px: ${PERCEPTION_IMAGE_MAX_EDGE:1280}

# 修改日志级别，查看 Spring AI 更多调用细节
logging:
  level:
    org.springframework.ai: DEBUG
    com.yupi.yuaiagent.permission: INFO
    com.yupi.yuaiagent.access: INFO
    com.yupi.yuaiagent.sandbox: INFO
    com.yupi.yuaiagent.mcp: INFO
    com.yupi.yuaiagent.metrics: INFO

# ─── Actuator & Metrics Configuration ───
management:
  endpoints:
    web:
      exposure:
        # Expose health, info, metrics, prometheus, agent-metrics, agent-diagnostics
        include: health,info,metrics,prometheus,agent-metrics,agent-diagnostics
      base-path: /actuator
  endpoint:
    health:
      show-details: always
    metrics:
      enabled: true
    prometheus:
      enabled: true
    agent-metrics:
      enabled: true
    agent-diagnostics:
      enabled: true
  metrics:
    tags:
      # Add application tag to all metrics
      application: ${spring.application.name}
    distribution:
      # Configure percentile histogram buckets
      percentiles-histogram:
        http.server.requests: true
        agent_request_duration: true
        agent_tool_call_duration: true
      # SLA boundaries for latency buckets
      sla:
        http.server.requests: 100ms,200ms,500ms,1s,2s,5s
        agent_request_duration: 500ms,1s,2s,5s,10s,30s
        agent_tool_call_duration: 100ms,200ms,500ms,1s,2s,5s

# ─── WorkPilot 质检配置 ───
workpilot:
  quality:
    # 质检审查模型（红蓝对抗用，与主对话模型不同以避免自我审查偏见）
    model: ${QUALITY_REVIEW_MODEL:qwen3.7-plus}

# ─── Reflexion 失败记忆配置 ───
reflexion:
  enabled: ${REFLEXION_ENABLED:true}
  max-memories-per-user: ${REFLEXION_MAX_MEMORIES:50}
  expiration-days: ${REFLEXION_EXPIRATION_DAYS:7}

# ─── RAG 配置 ───
rag:
  # 查询重写：额外一次同步 LLM，会拉高 TTFT；本地排查卡顿可设 enabled=false 对比
  query-rewrite:
    enabled: ${RAG_QUERY_REWRITE_ENABLED:true}
    timeout-ms: ${RAG_QUERY_REWRITE_TIMEOUT_MS:8000}
  pipeline:
    max-empty-retries: ${RAG_MAX_EMPTY_RETRIES:2}
  rerank:
    enabled: ${RERANK_ENABLED:true}
    top-k: ${RERANK_TOP_K:5}
    time-decay-enabled: ${RERANK_TIME_DECAY_ENABLED:true}
    time-decay-weight: ${RERANK_TIME_DECAY_WEIGHT:0.15}

# ─── 感知 / 上传生命周期（Ch5 P2）───
perception:
  hybrid:
    top-text: ${PERCEPTION_HYBRID_TOP_TEXT:3}
    top-vision: ${PERCEPTION_HYBRID_TOP_VISION:2}
  map-reduce:
    char-threshold: ${PERCEPTION_MAP_REDUCE_THRESHOLD:12000}
    chunk-size: ${PERCEPTION_MAP_REDUCE_CHUNK:4000}
  image-caption:
    llm-guess-enabled: ${PERCEPTION_IMAGE_CAPTION_LLM:true}
  upload:
    storage-dir: ${PERCEPTION_UPLOAD_DIR:./tmp/session-uploads}
    ttl-days: ${PERCEPTION_UPLOAD_TTL_DAYS:7}
    cleanup-cron: ${PERCEPTION_UPLOAD_CLEANUP_CRON:0 0 3 * * *}

# ─── 知识库 PDF 结构化入库 ───
knowledge:
  pdf:
    min-table-rows: ${KNOWLEDGE_PDF_MIN_TABLE_ROWS:2}
    min-table-cols: ${KNOWLEDGE_PDF_MIN_TABLE_COLS:2}
    sidecar-enabled: ${KNOWLEDGE_PDF_SIDECAR_ENABLED:true}
    table-sidecar-dir: ${KNOWLEDGE_PDF_SIDECAR_DIR:./tmp/knowledge/tables}
    text-chunk-size: ${KNOWLEDGE_PDF_TEXT_CHUNK_SIZE:200}

# ─── Paradigm 范式选择配置 ───
paradigm:
  selector:
    enabled: ${PARADIGM_SELECTOR_ENABLED:true}
    default-paradigm: ${DEFAULT_PARADIGM:react}

# ─── 分层记忆配置 ───
memory:
  coordinator:
    enabled: ${MEMORY_COORDINATOR_ENABLED:true}
    timeout-ms: ${MEMORY_COORDINATOR_TIMEOUT:2000}
    total-token-budget: ${MEMORY_TOKEN_BUDGET:6000}
  layers:
    sliding-window:
      max-messages: ${MEMORY_SLIDING_MAX_MESSAGES:20}
      token-budget-percent: 60
    fact-store:
      storage-dir: ${MEMORY_FACT_STORAGE_DIR:./tmp/memory/facts}
      token-budget-percent: 15
    summary:
      storage-dir: ${MEMORY_SUMMARY_STORAGE_DIR:./tmp/memory/summaries}
      max-checklists: ${MEMORY_SUMMARY_MAX_CHECKLISTS:5}
      trigger-threshold: ${MEMORY_SUMMARY_TRIGGER_THRESHOLD:10}
      token-budget-percent: 10
    experience:
      storage-dir: ${MEMORY_EXPERIENCE_STORAGE_DIR:./tmp/memory/experience}
      token-budget-percent: 15
      top-k: ${MEMORY_EXPERIENCE_TOP_K:3}
      similarity-threshold: ${MEMORY_EXPERIENCE_THRESHOLD:0.7}

# ─── DAG 工作流（固定流程：JOB_CHANGE / INTERVIEW）───
workflow:
  storage:
    dir: ${WORKFLOW_STORAGE_DIR:./tmp/workflows}
  dag:
    enabled: ${WORKFLOW_DAG_ENABLED:false}
